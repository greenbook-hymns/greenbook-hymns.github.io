<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, viewport-fit=cover, initial-scale=1, maximum-scale=8, user-scalable=yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Green Book">
<meta name="theme-color" content="#1f4d33">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Green Book Hymn Finder</title>
<script src="pdf.min.js"></script>
<script src="pdf.worker.min.js"></script>
<style>
:root{--g:#1f4d33;--g2:#2e6b48;--bg:#f4f1ea;--ink:#1b1b1b;--mut:#6b6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.screen{display:none;min-height:100%;flex-direction:column}
.screen.on{display:flex}
header{background:var(--g);color:#fff;padding:14px 16px;display:flex;align-items:center;gap:10px}
header h1{font-size:18px;margin:0;font-weight:600;flex:1}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-size:15px}
.wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px 16px;gap:16px;max-width:420px;width:100%;margin:0 auto}
.display{width:100%;background:#fff;border:2px solid var(--g);border-radius:14px;font-size:56px;font-weight:700;text-align:center;padding:10px;min-height:88px;letter-spacing:2px;color:var(--g)}
.display.empty{color:#c4c4c4;font-weight:400;font-size:28px;line-height:64px;letter-spacing:0}
.hint{color:var(--mut);font-size:14px;min-height:18px;text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.pad button{font-size:28px;padding:16px 0;border-radius:12px;border:0;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.15);color:var(--ink)}
.pad button:active{background:#e6e1d6}
.pad .go{background:var(--g);color:#fff;font-weight:700}
.pad .go:active{background:var(--g2)}
.search{width:100%;position:relative}
.search input{width:100%;font-size:18px;padding:14px 44px 14px 44px;border-radius:12px;border:2px solid #cfc8b8;background:#fff;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none}
.search input:focus{border-color:var(--g)}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%)}
.search .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:22px;color:#999;padding:6px 10px;display:none}
.searching .search .clr{display:block}
.searching #disp,.searching #hint,.searching #pad{display:none}
.results{width:100%;display:none;flex-direction:column;gap:8px}
.searching .results{display:flex}
.res{display:flex;gap:12px;align-items:flex-start;text-align:left;border:0;background:#fff;border-radius:12px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.12);font-size:16px;color:var(--ink);width:100%}
.res .num{flex:none;min-width:48px;text-align:center;background:var(--g);color:#fff;border-radius:8px;padding:6px 4px;font-weight:700;font-size:18px}
.res .ln{line-height:1.35}
.res mark{background:#e3efe6;color:var(--g);font-weight:700;border-radius:3px;padding:0 1px}
.rmsg{color:var(--mut);text-align:center;padding:16px 8px;font-size:15px}
.setup p{line-height:1.5;margin:0}
.big{display:block;width:100%;text-align:center;background:var(--g);color:#fff;border-radius:12px;padding:16px;font-size:18px;font-weight:600}
input[type=file]{display:none}
.viewer{background:#fff}
.pages{flex:1;background:#fff}
.pages canvas{display:block;width:100%;height:auto}
.pages canvas+canvas{border-top:1px solid #e3e3e3}
.msg{padding:30px 16px;text-align:center;color:var(--mut)}
.ctl{position:fixed;left:0;right:0;display:flex;gap:10px;padding:10px 12px;pointer-events:none;transition:opacity .25s;z-index:5}
.ctl.top{top:0;padding-top:max(10px,env(safe-area-inset-top))}
.ctl.bot{bottom:0;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.ctl button{pointer-events:auto;border:0;border-radius:22px;padding:10px 16px;font-size:16px;background:rgba(31,77,51,.88);color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.ctl .t{pointer-events:none;margin-left:auto;background:rgba(31,77,51,.88);color:#fff;border-radius:22px;padding:10px 16px;font-size:16px;font-weight:600}
.ctl.bot button{flex:1}
.ctl button:disabled{opacity:.35}
.hide .ctl{opacity:0}.hide .ctl button{pointer-events:none}
.small{font-size:13px;color:var(--mut);text-align:center}
.small a{color:var(--g2)}
</style>
</head>
<body>
<section id="setup" class="screen setup">
  <header><h1>Green Book Hymn Finder</h1></header>
  <div class="wrap">
    <p><b>One-time setup.</b> Choose your PDF copy of the Christadelphian Hymn Book (the Green Book). It stays on this phone, so you only do this once.</p>
    <label class="big" for="file">Choose the Green Book PDF</label>
    <input type="file" id="file" accept="application/pdf,.pdf">
    <div class="hint" id="setupMsg"></div>
    <p class="small">Tip: after setup, use your browser's <b>Share → Add to Home Screen</b> to put it on your home screen.</p>
  </div>
</section>

<section id="find" class="screen">
  <header><h1>Green Book</h1><button id="changeBtn" type="button">PDF</button></header>
  <div class="wrap" id="findWrap">
    <div class="search"><svg width="18" height="18" viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="6.5" stroke="#888" stroke-width="2.2" fill="none"/><path d="M13.5 13.5L18 18" stroke="#888" stroke-width="2.2" stroke-linecap="round"/></svg><input id="q" type="search" enterkeyhint="search" placeholder="Search hymn words…" autocomplete="off" autocapitalize="off" spellcheck="false"><button class="clr" id="qclr" type="button" aria-label="Clear">×</button></div>
    <div class="results" id="results"></div>
    <div class="display empty" id="disp">Hymn number</div>
    <div class="hint" id="hint"></div>
    <div class="pad" id="pad">
      <button>1</button><button>2</button><button>3</button>
      <button>4</button><button>5</button><button>6</button>
      <button>7</button><button>8</button><button>9</button>
      <button data-k="del">⌫</button><button>0</button><button data-k="go" class="go">Go</button>
    </div>
    <div class="small" id="ver">Version 6</div>
  </div>
</section>

<section id="view" class="screen viewer">
  <div class="pages" id="pages"></div>
  <div class="ctl top"><button id="backBtn" type="button">‹ Back</button><span class="t" id="vTitle">Hymn</span></div>
  <div class="ctl bot"><button id="prevH" type="button">‹ Prev hymn</button><button id="nextH" type="button">Next hymn ›</button></div>
</section>

<script>
const MAP=[4, 5, 7, 10, 11, 12, 13, 15, 16, 17, 20, 21, 22, 23, 24, 26, 28, 29, 31, 32, 33, 34, 35, 36, 38, 39, 40, 41, 44, 45, 47, 48, 49, 50, 52, 53, 55, 58, 59, 60, 61, 62, 63, 65, 67, 68, 69, 70, 72, 73, 74, 75, 76, 77, 78, 79, 80, 82, 83, 84, 85, 86, 90, 92, 93, 94, 95, 96, 98, 99, 100, 101, 103, 104, 106, 107, 109, 111, 113, 114, 115, 117, 119, 121, 123, 125, 126, 127, 129, 131, 132, 133, 134, 137, 138, 141, 142, 143, 145, 147, 149, 151, 152, 153, 155, 157, 159, 160, 161, 163, 165, 166, 167, 169, 170, 171, 174, 175, 176, 177, 179, 181, 183, 184, 185, 187, 188, 191, 193, 195, 196, 197, 199, 200, 203, 205, 206, 207, 208, 209, 213, 214, 215, 217, 219, 220, 221, 223, 224, 225, 227, 229, 230, 231, 232, 233, 234, 235, 236, 237, 238, 240, 241, 243, 244, 245, 246, 247, 248, 249, 253, 254, 255, 257, 258, 259, 261, 262, 263, 264, 265, 267, 268, 271, 272, 273, 274, 275, 277, 279, 280, 281, 282, 283, 285, 287, 289, 291, 292, 293, 294, 295, 297, 298, 299, 301, 302, 303, 304, 307, 309, 310, 311, 313, 314, 315, 316, 317, 318, 319, 320, 321, 323, 324, 325, 326, 327, 329, 331, 332, 333, 334, 335, 336, 337, 338, 339, 341, 342, 343, 345, 346, 347, 348, 349, 351, 353, 355, 357, 358, 359, 360, 361, 363, 364, 365, 367, 369, 370, 371, 373, 374, 375, 376, 377, 379, 380, 381, 383, 385, 387, 388, 389, 391, 393, 395, 396, 397, 399, 401, 402, 403, 404, 408, 409, 411, 413, 414, 415, 417, 421, 423, 424, 425, 427, 429, 431, 432, 433, 436, 437, 439, 440, 441, 442, 443, 444, 447, 451, 455, 456, 457, 458, 459, 461, 462, 463, 465, 466, 467, 469, 470, 471, 472, 473, 476, 479, 483, 486, 487, 489, 490, 491, 492, 493, 495, 496, 497, 499, 502, 503, 504, 505, 506, 507, 509, 510, 511, 512, 513, 515, 516, 517, 518, 519, 521, 523, 524, 525, 526, 529, 531, 532, 533, 535, 536, 537, 540, 541, 543, 544, 545, 547, 550, 551, 552, 553, 555, 556, 557, 559, 560, 561, 563, 565, 567, 569, 570, 571, 573, 574, 575, 576, 577, 580, 581, 582, 583, 584, 585, 587, 588, 589, 591, 592, 593, 594, 595, 596, 597, 598, 599, 600, 601, 603, 604, 605, 606, 607, 608, 609, 611, 612, 613, 614, 615, 617, 618, 619, 621, 623, 624, 625, 626, 627, 629, 631, 632];const END=633;
const TOTAL=MAP.length;
let pdf=null, entry="", current=0, token=0;
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));}

// ---- storage (IndexedDB, optional) ----
function idb(){return new Promise((res,rej)=>{try{const r=indexedDB.open('greenbook',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e)}});}
async function saveBlob(b){try{const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('f','readwrite');t.objectStore('f').put(b,'pdf');t.oncomplete=res;t.onerror=()=>rej(t.error);});}catch(e){}}
async function loadBlob(){try{const db=await idb();return await new Promise((res)=>{const t=db.transaction('f');const q=t.objectStore('f').get('pdf');q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);});}catch(e){return null}}

async function openPdf(blob){
  const buf=await blob.arrayBuffer();
  const doc=await pdfjsLib.getDocument({data:new Uint8Array(buf)}).promise;
  if(doc.numPages<END){throw new Error('This PDF only has '+doc.numPages+' pages — it doesn\'t look like the Green Book scan.');}
  return doc;
}

$('file').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f) return;
  $('setupMsg').textContent='Loading…';
  try{ pdf=await openPdf(f); await saveBlob(f); $('setupMsg').textContent=''; wordsState='none'; reset(); show('find'); loadWords(); }
  catch(err){ $('setupMsg').textContent=err.message||'Could not open that file.'; }
  e.target.value='';
});
$('changeBtn').onclick=()=>show('setup');

// ---- keypad ----
function reset(){entry="";paint();}
function paint(){
  const d=$('disp');
  if(entry){d.textContent=entry;d.classList.remove('empty');}
  else{d.textContent='Hymn number';d.classList.add('empty');}
  $('hint').textContent='';
}
function press(k){
  if(k==='del'){entry=entry.slice(0,-1);paint();return;}
  if(k==='go'){go();return;}
  if(entry.length>=3) return;
  if(entry===''&&k==='0') return;
  entry+=k; paint();
}
$('pad').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;press(b.dataset.k||b.textContent.trim());});
document.addEventListener('keydown',e=>{
  if(!$('find').classList.contains('on'))return;
  if(e.target&&e.target.tagName==='INPUT')return;
  if(/^[0-9]$/.test(e.key))press(e.key);
  else if(e.key==='Backspace')press('del');
  else if(e.key==='Enter')press('go');
});
function go(){
  const n=parseInt(entry,10);
  if(!n||n<1||n>TOTAL){$('hint').textContent='Hymns run from 1 to '+TOTAL+'.';return;}
  openHymn(n);
}

// ---- viewer ----
async function openHymn(n){
  current=n; const my=++token;
  $('vTitle').textContent='Hymn '+n;
  $('prevH').disabled=n<=1; $('nextH').disabled=n>=TOTAL;
  const box=$('pages'); box.innerHTML='<div class="msg">Loading…</div>'; window.scrollTo(0,0);
  show('view'); flash();
  if(location.hash!=='#h'+n){try{history.replaceState(null,'','#h'+n)}catch(e){}}
  const from=MAP[n-1], to=(n<TOTAL?MAP[n]:END)-1;
  const w=window.innerWidth, dpr=Math.min(window.devicePixelRatio||1,3), q=Math.max(dpr*2.5,3);
  let first=true;
  for(let p=from;p<=to;p++){
    const page=await pdf.getPage(p); if(my!==token) return;
    const v1=page.getViewport({scale:1}); const s=Math.min((w*q)/v1.width, 3200/v1.width);
    const vp=page.getViewport({scale:s});
    const c=document.createElement('canvas'); c.width=Math.floor(vp.width); c.height=Math.floor(vp.height);
    const ctx=c.getContext('2d');
    await page.render({canvasContext:ctx,viewport:vp}).promise; if(my!==token) return;
    const out=crop(c);
    if(first){box.innerHTML='';first=false;}
    out._frac=out._frac||1; box.appendChild(out);
    const cs=[...box.querySelectorAll('canvas')], mx=Math.max(...cs.map(x=>x._frac));
    cs.forEach(x=>{x.style.width=(x._frac/mx*100)+'%';x.style.margin='0 auto';});
  }
  flash();
}
// trim the white margins of a scanned page
function crop(c){
  const W=c.width,H=c.height,ctx=c.getContext('2d');
  const step=Math.max(1,Math.floor(W/600));
  const sw=Math.floor(W/step),sh=Math.floor(H/step);
  const sm=document.createElement('canvas');sm.width=sw;sm.height=sh;
  const sx=sm.getContext('2d');sx.drawImage(c,0,0,sw,sh);
  const d=sx.getImageData(0,0,sw,sh).data;
  const rows=new Uint16Array(sh),cols=new Uint16Array(sw);
  for(let y=0;y<sh;y++)for(let x=0;x<sw;x++){const i=(y*sw+x)*4;if(d[i]+d[i+1]+d[i+2]<480){rows[y]++;cols[x]++;}}
  const minR=Math.max(2,sw*0.004),minC=Math.max(2,sh*0.004);
  // ignore a thin dark band hugging the scan edge (scanner shadow)
  const edge=Math.round(Math.min(sw,sh)*0.012);
  let t=edge;while(t<sh&&rows[t]<minR)t++;
  let b=sh-1-edge;while(b>t&&rows[b]<minR)b--;
  let l=edge;while(l<sw&&cols[l]<minC)l++;
  let r=sw-1-edge;while(r>l&&cols[r]<minC)r--;
  if(r-l<sw*0.3||b-t<sh*0.2)return c;
  const pad=Math.round(sw*0.015);
  l=Math.max(0,l-pad);r=Math.min(sw-1,r+pad);t=Math.max(0,t-pad);b=Math.min(sh-1,b+pad);
  const X=l*step,Y=t*step,CW=Math.min(W-X,(r-l+1)*step),CH=Math.min(H-Y,(b-t+1)*step);
  const o=document.createElement('canvas');o.width=CW;o.height=CH;
  o.getContext('2d').drawImage(c,X,Y,CW,CH,0,0,CW,CH);
  o._frac=CW/W;
  return o;
}
// controls fade away so the hymn fills the screen; tap to bring them back
let hideT=null;
function flash(){const v=$('view');v.classList.remove('hide');clearTimeout(hideT);hideT=setTimeout(()=>v.classList.add('hide'),2500);}
$('pages').addEventListener('click',()=>{const v=$('view');if(v.classList.contains('hide'))flash();else{clearTimeout(hideT);v.classList.add('hide');}});
$('backBtn').onclick=()=>{token++;reset();show('find');try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}};
$('prevH').onclick=()=>{if(current>1)openHymn(current-1)};
$('nextH').onclick=()=>{if(current<TOTAL)openHymn(current+1)};


// ---- word search (index unlocks only with the Green Book PDF) ----
let WORDS=null, IDX=null, wordsState='none';
const ELIDE={"o'er":"over","e'er":"ever","ne'er":"never","e'en":"even","whate'er":"whatever","where'er":"wherever","howe'er":"however","whene'er":"whenever"};
function normWords(str){
  str=str.toLowerCase().replace(/[’‘`]/g,"'");
  const out=[];
  for(let w of str.split(/[^a-z0-9']+/)){
    w=w.replace(/^'+|'+$/g,''); if(!w) continue;
    if(ELIDE[w]){out.push(ELIDE[w]);continue;}
    if(/[a-z]'[a-z]/.test(w)) out.push(w.replace(/'/g,'e'));   // ev'ry -> every, heav'n -> heaven
    else out.push(w.replace(/'/g,''));
  }
  return out;
}
async function bookKey(doc){
  const p=await doc.getPage(1); const tc=await p.getTextContent();
  const src=tc.items.map(i=>i.str).join('|')+'#'+doc.numPages;
  const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(src));
  return crypto.subtle.importKey('raw',h,'AES-GCM',false,['decrypt']);
}
async function loadWords(){
  if(!pdf||wordsState==='ready'||wordsState==='loading') return;
  wordsState='loading';
  try{
    const buf=await (await fetch('words.bin')).arrayBuffer();
    const key=await bookKey(pdf);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:new Uint8Array(buf,0,12)},key,new Uint8Array(buf,12));
    const ds=new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'));
    WORDS=JSON.parse(await new Response(ds).text());
    const data=WORDS; WORDS=data.h||data;
    IDX=WORDS.map(lines=>{const lt=lines.map(normWords);const seq=[].concat(...lt);return {lt,set:new Set(seq),seq};});
    VOCAB=new Set();IDX.forEach(h=>h.set.forEach(w=>VOCAB.add(w)));VOCAB=[...VOCAB];
    wordsState='ready';
  }catch(e){wordsState='fail';}
  if($('q').value.trim()) runSearch();
}
const STOP=new Set('the a an and of to in my thy thee o oh is be for with on at by that his him he me i we our us it as from but not are art unto shall will thou ye you your yet so or no all this was hath doth'.split(' '));
function lev(a,b,max){ // Levenshtein distance, gives up past max
  if(Math.abs(a.length-b.length)>max) return max+1;
  let prev=Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){const cur=[i];let rowMin=i;
    for(let j=1;j<=b.length;j++){const v=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));cur.push(v);if(v<rowMin)rowMin=v;}
    if(rowMin>max) return max+1; prev=cur;}
  return prev[b.length];
}
let VOCAB=null;
function matchesFor(q,isLast){ // word -> weight for every indexed word that q could mean
  const m=new Map();
  for(const w of VOCAB){
    let wt=0;
    if(w===q) wt=1;
    else if(isLast&&q.length>=2&&w.startsWith(q)) wt=0.9;
    else if(q.length>=4&&w.startsWith(q)) wt=0.8;
    else if(q.length>=4){const d=lev(q,w,q.length>=7?2:1); if(d<=(q.length>=7?2:1)) wt=0.75-0.1*d;}
    if(wt) m.set(w,wt);
  }
  return m;
}
function esc(t){return t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function highlight(line,MS){
  return line.split(/(\s+)/).map(w=>{const n=normWords(w)[0];return n&&MS.some(m=>m.has(n))?'<mark>'+esc(w)+'</mark>':esc(w);}).join('');
}
function runSearch(){
  const raw=$('q').value, box=$('results'), wrap=$('findWrap');
  wrap.classList.toggle('searching',raw.trim().length>0);
  if(!raw.trim()){box.innerHTML='';return;}
  if(/^\d{1,3}$/.test(raw.trim())){const n=+raw.trim();box.innerHTML=(n>=1&&n<=TOTAL)?`<button class="res" data-n="${n}"><span class="num">${n}</span><span class="ln">Open hymn ${n}</span></button>`:'<div class="rmsg">Hymns run from 1 to '+TOTAL+'.</div>';return;}
  if(wordsState!=='ready'){box.innerHTML='<div class="rmsg">'+(wordsState==='fail'?'Word search only works with the Green Book PDF this app was made for.':'Getting the words ready…')+'</div>';if(wordsState==='none')loadWords();return;}
  const qs=normWords(raw); if(!qs.length){box.innerHTML='';return;}
  const endsWithSpace=/\s$/.test(raw);
  const MS=qs.map((q,k)=>matchesFor(q,k===qs.length-1&&!endsWithSpace));
  let content=qs.map((q,k)=>k).filter(k=>!STOP.has(qs[k]));
  if(!content.length) content=qs.map((q,k)=>k);
  let need=content.length<=2?content.length:Math.ceil(content.length*0.6);
  let res=[], partial=false;
  for(let pass=0;pass<2;pass++){
  IDX.forEach((h,i)=>{
    let sc=0,hit=0;
    for(const k of content){let best=0;for(const [w,wt] of MS[k]) if(wt>best&&h.set.has(w)) best=wt; if(best){hit++;sc+=best*3;}}
    if(hit<need) return;
    // longest run of the typed words in order, anywhere in the hymn (across line breaks too)
    const seq=h.seq; let run=0;
    for(let s0=0;s0<seq.length;s0++){let r=0;while(r<qs.length&&s0+r<seq.length&&MS[r].has(seq[s0+r]))r++; if(r>run)run=r; if(run===qs.length)break;}
    sc+=run*run;
    // best line to show
    let bl=0,bc=-1;
    h.lt.forEach((lt,li)=>{let c=0;for(const m of MS)if(lt.some(w=>m.has(w)))c++;const two=li+1<h.lt.length?h.lt[li].concat(h.lt[li+1]):lt;if(c>bc){bc=c;bl=li;}});
    let line=WORDS[i][bl]||'';
    const nxt=WORDS[i][bl+1];
    if(nxt&&qs.length>2&&run>=2){const both=h.lt[bl].concat(h.lt[bl+1]);let c2=0;for(const m of MS)if(both.some(w=>m.has(w)))c2++;if(c2>bc)line=line+' / '+nxt;}
    res.push({n:i+1,sc,line});
  });
  if(res.length||need<=1) break;
  need=Math.max(1,need-1); partial=true;
  }
  res.sort((a,b)=>b.sc-a.sc||a.n-b.n);
  if(!res.length){box.innerHTML='<div class="rmsg">No hymns found. Try fewer or different words.</div>';return;}
  box.innerHTML=(partial?'<div class="rmsg">No hymn has all those words. Closest matches:</div>':'')+res.slice(0,40).map(r=>`<button class="res" data-n="${r.n}"><span class="num">${r.n}</span><span class="ln">${highlight(r.line,MS)}</span></button>`).join('')+(res.length>40?'<div class="rmsg">Showing the best 40. Add more words to narrow it down.</div>':'');
}
let sT=null;
$('q').addEventListener('input',()=>{clearTimeout(sT);sT=setTimeout(runSearch,120);});
$('q').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();$('q').blur();}});
$('qclr').onclick=()=>{$('q').value='';runSearch();$('q').focus();};
$('results').addEventListener('click',e=>{const b=e.target.closest('.res');if(b){$('q').blur();openHymn(+b.dataset.n);}});

// ---- start ----
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{try{r.update()}catch(e){}}).catch(()=>{});
  let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(reloaded)return;reloaded=true;location.reload();});}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
(async()=>{
  const b=await loadBlob();
  if(b){try{pdf=await openPdf(b);}catch(e){pdf=null}}
  if(!pdf){show('setup');return;}
  loadWords();
  const m=/^#h(\d+)$/.exec(location.hash);
  if(m&&+m[1]>=1&&+m[1]<=TOTAL)openHymn(+m[1]); else {reset();show('find');}
})();
</script>
